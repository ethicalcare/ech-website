name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium for fictional phone check
        run: ./node_modules/.bin/playwright-core install --with-deps --only-shell chromium
        timeout-minutes: 8
      - name: Check selected visit at phone width (fictional data)
        run: npm run test:browser:phone
        timeout-minutes: 3
